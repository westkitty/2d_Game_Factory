<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Suppresses the browser's automatic /favicon.ico request - see starter/index.html's identical tag for why. -->
    <link rel="icon" href="data:," />
    <title>SW2D Tiled Proof</title>
  </head>
  <body>
    <main id="app">
      <nav class="theme-switch" aria-label="Theme">
        <a href="?theme=default">default</a>
        <a href="?theme=neon">neon</a>
      </nav>
      <div id="game-root" aria-label="Game canvas">
        <!-- Visible Start control: an ordinary semantic CONFIRM press (see index.html). -->
        <button type="button" id="start-overlay" class="start-overlay" data-sw2d-action="CONFIRM" aria-label="Start game">Start</button>
      </div>

      <!--
        Touch controls bind by name through the semantic input layer. They are
        ordinary DOM buttons: no gameplay code knows they exist.
      -->
      <div id="touch-controls" class="touch-controls" hidden>
        <div class="touch-cluster touch-cluster--left">
          <button type="button" class="touch-button" data-sw2d-action="MOVE_LEFT" aria-label="Move left">&#9664;</button>
          <button type="button" class="touch-button" data-sw2d-action="MOVE_RIGHT" aria-label="Move right">&#9654;</button>
        </div>
        <div class="touch-cluster touch-cluster--right">
          <button type="button" class="touch-button" data-sw2d-action="PAUSE" aria-label="Pause">II</button>
          <button type="button" class="touch-button touch-button--primary" data-sw2d-action="CONFIRM" aria-label="Confirm and jump">A</button>
        </div>
      </div>

      <noscript>This game requires JavaScript.</noscript>
    </main>
    <script type="module" src="/src/tiledProofMain.ts"></script>
  </body>
</html>
